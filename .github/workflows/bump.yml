name: bump
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the cask to the latest Keyway release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/arminsameti/Keyway/releases/latest --jq .tag_name)
          version=${tag#v}
          current=$(sed -n 's/^  version "\(.*\)"/\1/p' Casks/keyway.rb)
          [ "$version" = "$current" ] && { echo "up to date ($current)"; exit 0; }
          sums=$(curl -fsSL "https://github.com/arminsameti/Keyway/releases/download/$tag/SHA256SUMS.txt")
          sha=$(echo "$sums" | awk -v f="Keyway-$tag-macOS.zip" '$2==f{print $1}')
          [ -n "$sha" ] || { echo "no checksum for $tag"; exit 1; }
          sed -i "s/^  version \".*\"/  version \"$version\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/keyway.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "keyway $version"
          git push
